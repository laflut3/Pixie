name: Publish release and package repositories

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pixie-apt-pages
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Expected a stable SemVer tag: vX.Y.Z" >&2; exit 1; }
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          test "$tag_version" = "$cargo_version" || { echo "Tag $GITHUB_REF_NAME does not match Cargo version $cargo_version" >&2; exit 1; }
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools zstd
      - name: Build static Linux binary and packages
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          export "CC_${TARGET//-/_}=musl-gcc"
          linker_var="CARGO_TARGET_${TARGET^^}_LINKER"
          export "${linker_var//-/_}=musl-gcc"
          cargo build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/pixie"
          infrastructure/scripts/build-deb.sh "$binary"
          mkdir -p packages
          mv pixie_*_"$ARCH".deb packages/
          infrastructure/scripts/build-archive.sh "$binary" "$ARCH" packages
          infrastructure/scripts/build-arch-package.sh packages/pixie_*_linux_"$ARCH".tar.gz packages
      - uses: actions/upload-artifact@v6
        with:
          name: pixie-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: pixie-${{ matrix.arch }}
          path: packages
      - name: Prepare prebuilt image context
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          archive="packages/pixie_"$version"_linux_"$ARCH".tar.gz"
          mkdir image-context
          tar -xzf "$archive" -C image-context
          cp infrastructure/docker/Dockerfile.prebuilt image-context/Dockerfile
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: image-context
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/laflut3/pixie:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    needs: [package, image]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish multi-architecture image tags
        env:
          IMAGE: ghcr.io/laflut3/pixie
          VERSION: ${{ github.ref_name }}
        run: |
          version_number="$(printf '%s' "$VERSION" | sed 's/^v//')"
          docker buildx imagetools create \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$version_number" \
            "$IMAGE:$GITHUB_SHA-amd64" \
            "$IMAGE:$GITHUB_SHA-arm64"
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - uses: actions/download-artifact@v6
        with:
          path: packages
          pattern: pixie-*
          merge-multiple: true
      - name: Build and sign APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: infrastructure/apt/build-repository.sh packages public
      - name: Build Arch repositories
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          docker run --rm \
            -e APT_GPG_PRIVATE_KEY -e APT_GPG_KEY_ID -e APT_GPG_PASSPHRASE \
            -v "$PWD:/work" -w /work archlinux:base \
            bash -c 'pacman -Sy --noconfirm archlinux-keyring && pacman -Syu --noconfirm gnupg libarchive && infrastructure/arch/build-repository.sh packages public/arch'
          cp public/arch/*/*.pkg.tar.zst.sig packages/
      - uses: azure/setup-helm@v4
      - name: Build Helm repository
        run: |
          infrastructure/helm/build-repository.sh "$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')" public/charts
          cp public/charts/*.tgz packages/
      - name: Include static documentation
        run: cp -R docs public/docs
      - name: Checksum release assets
        run: (cd packages && sha256sum * > SHA256SUMS)
      - name: Create GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --title "Pixie $tag" --generate-notes --verify-tag
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
