name: Publish container image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --release --locked
      - name: Prepare image context
        run: |
          mkdir -p image-context/usr/bin image-context/usr/share/pixie/web image-context/etc/pixie/sites/default
          install -m 0755 target/release/pixie image-context/usr/bin/pixie
          install -m 0644 infrastructure/config/config-pixie.yml image-context/etc/pixie/config-pixie.yml
          cp web/*.html image-context/usr/share/pixie/web/
          cp web/*.html image-context/etc/pixie/sites/default/
          cp infrastructure/docker/Dockerfile.prebuilt image-context/Dockerfile
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: image-context
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/laflut3/pixie:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish multi-architecture tags
        env:
          IMAGE: ghcr.io/laflut3/pixie
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$GITHUB_SHA-amd64" \
            "$IMAGE:$GITHUB_SHA-arm64"
