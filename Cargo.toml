[package]
name = "pixie"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal static HTTP server written in Rust"
license = "MIT"
repository = "https://github.com/laflut3/Pixie"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rustls = "0.23"
rustls-pemfile = "2"
