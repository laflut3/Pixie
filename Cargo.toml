[package]
name = "pixie"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal static HTTP server written in Rust"
license = "MIT"
repository = "https://github.com/laflut3/Pixie"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "1.2"
rustls = "0.23"
rustls-pemfile = "2"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-rustls = "0.26"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
cap-std = "4"
