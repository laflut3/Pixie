[package]
name = "pixie"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal static HTTP server written in Rust"
license = "MIT"
repository = "https://github.com/laflut3/Pixie"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rustls = "0.23"
rustls-pemfile = "2"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-rustls = "0.26"
