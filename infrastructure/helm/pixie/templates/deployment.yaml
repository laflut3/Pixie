apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pixie.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "pixie.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pixie.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pixie.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pixie
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PIXIE_CONFIG
              value: /etc/pixie/config-pixie.yml
            - name: PIXIE_WEB_ROOT
              value: /usr/share/pixie/web
          readinessProbe:
            httpGet:
              path: /hello
              port: http
          livenessProbe:
            httpGet:
              path: /hello
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pixie
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "pixie.fullname" . }}-config
