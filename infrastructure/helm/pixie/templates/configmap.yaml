apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pixie.fullname" . }}-config
data:
  config-pixie.yml: |
    addr: {{ .Values.config.addr | quote }}
    workers: {{ .Values.config.workers }}
    {{- if .Values.http3.enabled }}
    http3:
      addr: {{ .Values.http3.addr | quote }}
    {{- end }}
