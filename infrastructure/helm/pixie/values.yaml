replicaCount: 1
image:
  repository: ghcr.io/laflut3/pixie
  tag: ""
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
config:
  addr: 0.0.0.0:8080
  workers: 4
tls:
  enabled: false
  secretName: ""
  certFile: /etc/pixie/tls/tls.crt
  keyFile: /etc/pixie/tls/tls.key
  clientCaFile: ""
http3:
  enabled: false
  addr: 0.0.0.0:8443
  port: 8443
resources: {}

sites:
  root: /etc/pixie/sites
  spaFallback: false
  existingClaim: ""
